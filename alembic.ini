[alembic]
script_location = database/migrations
prepend_sys_path = backend:.
# URL is read from app settings in env.py; this is a fallback for CLI usage.
sqlalchemy.url = postgresql+asyncpg://cortex:cortex@localhost:5432/cortex

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
