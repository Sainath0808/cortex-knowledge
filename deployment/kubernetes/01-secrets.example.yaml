# NEVER commit real secrets. In production use ExternalSecrets/AzureKeyVault CSI.
# Create manually:
#   kubectl -n cortex create secret generic cortex-secrets \
#     --from-literal=AZURE_OPENAI_ENDPOINT=... \
#     --from-literal=AZURE_OPENAI_API_KEY=... \
#     --from-literal=JWT_SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: "https://REPLACE.openai.azure.com"
  AZURE_OPENAI_API_KEY: "REPLACE"
  JWT_SECRET_KEY: "REPLACE"
