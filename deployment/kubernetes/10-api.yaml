apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-api
  namespace: cortex
spec:
  replicas: 2
  selector:
    matchLabels: { app: cortex-api }
  template:
    metadata:
      labels: { app: cortex-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/cortex-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: cortex-config }
            - secretRef: { name: cortex-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-api
  namespace: cortex
spec:
  selector: { app: cortex-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cortex-api
  namespace: cortex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortex-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
