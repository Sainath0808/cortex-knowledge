apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex
  namespace: cortex
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"  # SSE
spec:
  ingressClassName: nginx
  rules:
    - host: cortex.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: cortex-api, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: cortex-frontend, port: { number: 80 } }
