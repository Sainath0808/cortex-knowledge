apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-worker
  namespace: cortex
spec:
  replicas: 2
  selector:
    matchLabels: { app: cortex-worker }
  template:
    metadata:
      labels: { app: cortex-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/YOUR_ORG/cortex-worker:latest
          envFrom:
            - configMapRef: { name: cortex-config }
            - secretRef: { name: cortex-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
