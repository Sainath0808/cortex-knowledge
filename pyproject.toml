[project]
name = "cortex"
version = "0.1.0"
description = "Cortex - Enterprise Knowledge Copilot. Production-grade RAG + Agents platform."
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # Data
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.10",
    # AI
    "openai>=1.40",
    "tiktoken>=0.7",
    "langgraph>=0.2.20",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "mcp>=1.1",
    # Workers
    "arq>=0.26",
    # Auth / security
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    # Config / validation
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    # Resilience
    "tenacity>=8.5",
    # Observability
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "prometheus-client>=0.20",
    # Document parsing
    "pypdf>=4.3",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[tool.setuptools]
# Dependency-only install; code is run via PYTHONPATH (see Makefile / Dockerfiles).
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
