name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend ai agents mcp_server tests
      - name: Tests
        run: pytest -q --cov=backend --cov=ai --cov=agents --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET_KEY: ci-test-secret

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install && npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/cortex-api:latest
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository }}/cortex-worker:latest
